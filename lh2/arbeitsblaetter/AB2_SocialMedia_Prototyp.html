<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB 2 – Drei Profile im Vergleich | Interaktiver Prototyp</title>
<style>
  :root {
    --app-bg: #efeae2;
    --frame-bg: #ffffff;
    --ink: #1f1d1a;
    --ink-soft: #4a4741;
    --muted: #8b857b;
    --line: #ece6dc;
    --line-strong: #dcd4c6;
    --tab-active: #1f1d1a;
    --btn-blue: #3897f0;

    /* Per-profile theme (set via [data-profile] on body) */
    --accent: #a88f6a;
    --accent-dark: #6b5a42;
    --placeholder-a: #f3ede1;
    --placeholder-b: #d9ceb6;
    --chip: #f5efe4;
  }

  body[data-profile="perfect"] {
    --accent: #a88f6a;
    --accent-dark: #6b5a42;
    --placeholder-a: #f3ede1;
    --placeholder-b: #c7b793;
    --chip: #f5efe4;
  }
  body[data-profile="authentic"] {
    --accent: #b07a6a;
    --accent-dark: #7a4e42;
    --placeholder-a: #ece2d8;
    --placeholder-b: #c7b3a6;
    --chip: #f2ece4;
  }
  body[data-profile="creative"] {
    --accent: #3a7d7b;
    --accent-dark: #25514f;
    --placeholder-a: #e4ded0;
    --placeholder-b: #8fb3a8;
    --chip: #eaeadf;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--app-bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== TOP BAR ===== */
  .appbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #fff;
    border-bottom: 1px solid var(--line);
  }
  .appbar-inner {
    max-width: 760px;
    margin: 0 auto;
    padding: 14px 20px 0;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: -0.2px;
    margin-bottom: 12px;
  }
  .brand .logo {
    width: 24px; height: 24px;
    border-radius: 7px;
    background: linear-gradient(135deg, #ffb84f, #ff4f91 50%, #8a4fff);
    display: inline-block;
  }
  .brand .meta {
    margin-left: auto;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 500;
  }

  .tabs {
    display: flex;
    gap: 0;
    margin: 0 -20px;
    padding: 0 20px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 1;
    min-width: 180px;
    padding: 14px 8px 12px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    text-align: center;
    transition: color 0.15s, border-color 0.15s;
    letter-spacing: -0.1px;
  }
  .tab:hover { color: var(--ink-soft); }
  .tab .tag {
    display: block;
    font-size: 10px;
    letter-spacing: 1.3px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 3px;
    font-weight: 600;
  }
  .tab.active {
    color: var(--ink);
    border-bottom-color: var(--tab-active);
  }
  .tab.active .tag { color: var(--accent-dark); }

  /* ===== MAIN FRAME ===== */
  main {
    max-width: 520px;
    margin: 24px auto 80px;
    padding: 0 16px;
  }
  .frame {
    background: var(--frame-bg);
    border-radius: 18px;
    box-shadow:
      0 1px 2px rgba(0,0,0,0.04),
      0 14px 40px rgba(31,29,26,0.08);
    overflow: hidden;
  }

  /* ===== PROFILE HEADER ===== */
  .p-head {
    padding: 24px 20px 16px;
    display: flex;
    gap: 18px;
    align-items: center;
  }
  .p-pic {
    width: 74px; height: 74px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--placeholder-a), var(--accent) 75%);
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.85);
    font-size: 8px;
    letter-spacing: 1.4px;
    text-align: center;
    font-weight: 500;
    border: 3px solid #fff;
    box-shadow: 0 0 0 2px var(--accent);
    flex-shrink: 0;
  }
  body[data-profile="creative"] .p-pic {
    background:
      radial-gradient(circle at 30% 30%, #c8e0c7, #3a7d7b 70%),
      radial-gradient(circle at 70% 70%, #d4a979, transparent 60%);
  }
  .p-meta { flex: 1; min-width: 0; }
  .p-handle {
    display: flex; align-items: center; gap: 6px;
    font-size: 17px; font-weight: 500;
    margin-bottom: 10px;
    word-break: break-all;
  }
  .p-handle .check {
    width: 14px; height: 14px;
    background: var(--btn-blue);
    color: #fff;
    border-radius: 50%;
    display: inline-flex;
    align-items: center; justify-content: center;
    font-size: 9px; font-weight: bold;
    flex-shrink: 0;
  }
  .p-stats {
    display: flex; gap: 14px;
    font-size: 12px;
    color: var(--muted);
  }
  .p-stats > div { line-height: 1.2; }
  .p-stats strong {
    display: block;
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .p-bio {
    padding: 0 20px 16px;
    font-size: 13px;
  }
  .p-bio .name { font-weight: 600; margin-bottom: 4px; }
  .p-bio .tagline { color: var(--ink); }
  .p-bio .slogan { color: var(--accent-dark); margin-top: 2px; }

  /* ===== VIEW SWITCH ===== */
  .view-switch {
    display: flex;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .view-btn {
    flex: 1;
    padding: 12px 10px;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    border-top: 1.5px solid transparent;
    margin-top: -1px;
    transition: color 0.15s, border-color 0.15s;
    font-weight: 600;
  }
  .view-btn:hover { color: var(--ink-soft); }
  .view-btn.active {
    color: var(--ink);
    border-top-color: var(--ink);
  }
  .view-btn .icon { margin-right: 6px; opacity: 0.7; }

  /* ===== FEED / TIMELINE ===== */
  .feed { padding: 0; }
  .post {
    border-bottom: 1px solid var(--line);
    padding-bottom: 14px;
  }
  .post:last-child { border-bottom: none; }

  .post-head {
    padding: 14px 16px 10px;
    display: flex; align-items: center; gap: 10px;
  }
  .post-avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--placeholder-a), var(--accent) 75%);
    border: 1.5px solid #fff;
    box-shadow: 0 0 0 1.5px var(--accent);
    flex-shrink: 0;
  }
  body[data-profile="creative"] .post-avatar {
    background:
      radial-gradient(circle at 30% 30%, #c8e0c7, #3a7d7b 70%);
  }
  .post-user {
    flex: 1; min-width: 0;
    font-size: 13px;
    font-weight: 500;
  }
  .post-user .time {
    display: block;
    font-size: 10px;
    color: var(--muted);
    font-weight: 400;
    margin-top: 1px;
  }
  .post-menu { color: var(--muted); font-size: 18px; letter-spacing: 2px; }

  .post-image {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: linear-gradient(135deg, var(--placeholder-a), var(--placeholder-b));
  }
  .post-image.alt { background: linear-gradient(160deg, var(--placeholder-b), var(--placeholder-a)); }
  .post-image.stripe {
    background:
      repeating-linear-gradient(45deg,
        var(--placeholder-a) 0 22px,
        var(--placeholder-b) 22px 44px);
  }
  .post-image.quote,
  .post-image.text {
    padding: 32px 28px;
    flex-direction: column;
    text-align: center;
  }
  .post-image.quote {
    background: linear-gradient(160deg, #2d2a26 0%, #4a4036 100%);
    color: #fff;
  }
  .post-image.quote .qt {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px; line-height: 1.35;
    font-style: italic;
    max-width: 260px;
    margin-bottom: 14px;
  }
  .post-image.quote .qdash {
    width: 30px; height: 1px;
    background: rgba(255,255,255,0.5);
    margin: 0 auto 10px;
  }
  .post-image.quote .qattr {
    font-size: 9px; letter-spacing: 2.4px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }
  .post-image.text-card {
    background: #f5efe4;
    color: var(--ink);
  }
  .post-image.text-card .text-body {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 22px;
    line-height: 1.4;
    font-style: italic;
    max-width: 300px;
    margin: 0;
  }
  .post-image.screenshot {
    background: #e8e3d8;
    padding: 24px;
    justify-content: center;
  }
  .post-image.screenshot .chat-bubble {
    background: #fff;
    border-radius: 18px 18px 18px 4px;
    padding: 12px 16px;
    font-size: 14px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    max-width: 240px;
    text-align: left;
    line-height: 1.4;
  }
  .post-image.screenshot .chat-bubble.mine {
    border-radius: 18px 18px 4px 18px;
    background: #d7e9d4;
    margin-left: auto;
    margin-top: 8px;
  }
  .post-image.creative-art {
    background:
      radial-gradient(circle at 20% 80%, #5a8c7d, transparent 55%),
      radial-gradient(circle at 80% 30%, #d4a979, transparent 45%),
      linear-gradient(160deg, #274848, #3a7d7b);
  }
  .post-image.moodboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 3px;
    padding: 0;
    background: #fff;
  }
  .post-image.moodboard > span {
    display: block;
  }
  .post-image.wip {
    background:
      linear-gradient(90deg, transparent 66%, rgba(255,255,255,0.85) 66%),
      linear-gradient(135deg, #3a6b54, #1f4035);
  }

  .ph-note {
    position: absolute;
    background: rgba(255,255,255,0.92);
    padding: 8px 14px;
    border-radius: 5px;
    font-size: 10px;
    color: var(--accent-dark);
    letter-spacing: 1.2px;
    text-transform: uppercase;
    font-weight: 600;
    border: 1.5px dashed var(--accent);
    max-width: 80%;
    text-align: center;
  }

  .post-actions {
    padding: 10px 14px 2px;
    display: flex; gap: 16px;
    font-size: 20px;
    color: var(--ink);
  }
  .post-actions .bookmark { margin-left: auto; }
  .post-actions span { cursor: default; }

  .post-likes {
    padding: 0 16px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .post-caption {
    padding: 0 16px 8px;
    font-size: 13px;
    line-height: 1.45;
  }
  .post-caption .handle { font-weight: 600; margin-right: 6px; }
  .post-caption .hashtags { color: var(--accent-dark); }

  .post-comments {
    padding: 0 16px;
    font-size: 13px;
    line-height: 1.5;
  }
  .post-comments .c {
    margin-bottom: 3px;
    color: var(--ink);
  }
  .post-comments .c .cuser { font-weight: 600; margin-right: 6px; }
  .post-comments .c .reply-mark {
    font-size: 10px;
    color: var(--accent-dark);
    letter-spacing: 0.6px;
    margin-left: 6px;
    font-weight: 500;
    text-transform: uppercase;
  }
  .post-comments .c.reply {
    padding-left: 20px;
    color: var(--ink-soft);
  }
  .more-comments {
    display: inline-block;
    margin-top: 4px;
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: none;
    padding: 0;
    font-family: inherit;
    cursor: pointer;
  }
  .more-comments:hover { color: var(--ink-soft); text-decoration: underline; }
  .hidden-comments { display: none; }
  .hidden-comments.open { display: block; }

  .post-time {
    padding: 6px 16px 0;
    font-size: 10px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ===== ACTIVITIES VIEW ===== */
  .activities { padding: 18px 16px 22px; display: none; flex-direction: column; gap: 14px; }
  .activities.active { display: flex; }
  .feed.hidden { display: none; }

  .dash-card {
    background: var(--chip);
    border: 1px solid var(--line-strong);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .dash-card h3 {
    margin: 0 0 10px;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  .rhythm {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
  }
  .rhythm-label { font-size: 13px; color: var(--ink-soft); }
  .rhythm-label strong {
    display: block;
    font-size: 18px;
    font-weight: 600;
    margin-top: 2px;
    color: var(--ink);
  }
  .rhythm-bars { display: flex; gap: 2px; }
  .rhythm-bars i {
    display: block;
    width: 5px; height: 22px;
    background: var(--accent);
    border-radius: 1px;
  }
  .rhythm-bars i.gap { background: var(--line-strong); height: 12px; align-self: center; }
  .rhythm-bars i.small { height: 14px; opacity: 0.55; }

  .follows-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
  .follows-list li { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .follows-list .handle { color: var(--ink); font-weight: 500; }
  .follows-list .cat { color: var(--muted); font-size: 11px; text-align: right; flex-shrink: 0; }

  .top-comments { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-style: italic; color: var(--ink); }
  .top-comments span { color: var(--muted); font-style: normal; font-size: 11px; margin-left: 6px; }

  .activity-row { display: flex; align-items: flex-end; gap: 20px; }
  .activity-num { font-size: 26px; font-weight: 600; line-height: 1; }
  .activity-lbl { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .activity-bar {
    flex: 1;
    height: 10px;
    background: var(--line-strong);
    border-radius: 5px;
    overflow: hidden;
  }
  .activity-bar i {
    display: block;
    height: 100%;
    background: var(--accent);
    border-radius: 5px;
  }
  .activity-scale {
    display: flex; justify-content: space-between;
    font-size: 9px; color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .reply-style {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  /* ===== FOOTER ===== */
  .edu-foot {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 24px 40px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.4px;
  }
  .edu-foot strong { color: var(--ink-soft); font-weight: 600; }

  @media (max-width: 520px) {
    main { padding: 0 8px; }
    .tab { min-width: 140px; }
    .p-handle { font-size: 15px; }
    .p-stats strong { font-size: 13px; }
  }
</style>
</head>

  const frame = document.getElementById("profileFrame");

  function renderProfile(key) {
    const p = PROFILES[key];
    document.body.setAttribute("data-profile", key);

    const pPicAttrs = p.photo
      ? `style="background-image:url('${p.photo}');background-size:cover;background-position:center;box-shadow:0 0 0 2px var(--accent);"`
      : "";
    const pPicInner = p.photo ? "" : "PROFIL-<br>BILD";

    frame.innerHTML = `
      <header class="p-head">
        <div class="p-pic" ${pPicAttrs}>${pPicInner}</div>
        <div class="p-meta">
          <div class="p-handle">
            ${p.handle}${p.verified ? '<span class="check" aria-label="verifiziert">✓</span>' : ""}
          </div>
          <div class="p-stats">
            <div><strong>${p.stats.posts}</strong>Beiträge</div>
            <div><strong>${p.stats.followers}</strong>Follower</div>
            <div><strong>${p.stats.following}</strong>Gefolgt</div>
          </div>
        </div>
      </header>

      <div class="p-bio">
        <div class="name">${p.name}</div>
        <div class="tagline">${p.tagline}</div>
        <div class="slogan">${p.slogan}</div>
      </div>

      <div class="view-switch" role="tablist">
        <button class="view-btn active" data-view="feed" role="tab">
          <span class="icon">▤</span>Feed
        </button>
        <button class="view-btn" data-view="activities" role="tab">
          <span class="icon">◉</span>Aktivitäten
        </button>
      </div>

      <section class="feed" aria-label="Timeline">
        ${p.posts.map((post, i) => renderPost(post, i, p.handle, p.photo)).join("")}
      </section>

      <section class="activities" aria-label="Aktivitäten">
        ${renderActivities(p.activity)}
      </section>
    `;

    bindViewSwitch();
    bindCommentExpand();
  }

  function renderPost(post, idx, handle, profilePhoto) {
    const img = post.image;
    let imageBlock = "";

    if (img.photo) {
      imageBlock = `
        <div class="post-image">
          <img src="${img.photo}" alt="${img.label ?? ""}" style="width:100%;height:100%;object-fit:cover;display:block;">
        </div>`;
    } else if (img.style === "quote") {
      imageBlock = `
        <div class="post-image quote">
          <div class="qt">${img.quote}</div>
          <div class="qdash"></div>
          <div class="qattr">${img.attr}</div>
        </div>`;
    } else if (img.style === "text-card") {
      imageBlock = `
        <div class="post-image text-card">
          <div class="text-body">${img.textBody}</div>
        </div>`;
    } else if (img.style === "screenshot") {
      imageBlock = `
        <div class="post-image screenshot">
          <div>
            <div class="chat-bubble">${img.chatA}</div>
            <div class="chat-bubble mine">${img.chatB}</div>
          </div>
        </div>`;
    } else if (img.style === "moodboard") {
      imageBlock = `
        <div class="post-image moodboard" aria-label="Moodboard-Platzhalter">
          <span style="background:#3a7d7b"></span>
          <span style="background:#274848"></span>
          <span style="background:#d4a979"></span>
          <span style="background:#f1ead8"></span>
          <span style="background:linear-gradient(135deg,#5a8c7d,#274848)"></span>
          <span style="background:#b9663f"></span>
          <span style="background:#8faf9c"></span>
          <span style="background:#f5efe4"></span>
          <span style="background:#c4a06e"></span>
        </div>`;
    } else if (img.style === "creative-art") {
      imageBlock = `
        <div class="post-image creative-art">
          <div class="ph-note">${img.label ?? "Platzhalter · Illustration"}</div>
        </div>`;
    } else if (img.style === "wip") {
      imageBlock = `
        <div class="post-image wip">
          <div class="ph-note">${img.label ?? "Platzhalter · WIP"}</div>
        </div>`;
    } else {
      const cls = img.style === "stripe" ? "stripe" : (img.style === "alt" ? "alt" : "");
      imageBlock = `
        <div class="post-image ${cls}">
          <div class="ph-note">${img.label ?? "Platzhalter · Foto"}</div>
        </div>`;
    }

    const commentsBlock = renderComments(post.comments, post.hiddenComments, post.totalComments, handle, idx);
    const hashtags = post.hashtags
      ? `<span class="hashtags">${post.hashtags}</span>`
      : "";

    const avatarAttrs = profilePhoto
      ? `style="background:url('${profilePhoto}') center/cover;"`
      : "";

    return `
      <article class="post">
        <div class="post-head">
          <div class="post-avatar" ${avatarAttrs}></div>
          <div class="post-user">
            ${handle}
            <span class="time">${post.time}</span>
          </div>
          <div class="post-menu">···</div>
        </div>
        ${imageBlock}
        <div class="post-actions">
          <span title="Like">♡</span>
          <span title="Kommentieren">💬</span>
          <span title="Teilen">↗</span>
          <span class="bookmark" title="Speichern">⌘</span>
        </div>
        <div class="post-likes">${post.likes.toLocaleString("de-DE")} „Gefällt mir“-Angaben</div>
        <div class="post-caption">
          <span class="handle">${handle}</span>${post.caption}
          ${hashtags}
        </div>
        ${commentsBlock}
      </article>
    `;
  }

  function renderComments(visible, hidden, total, handle, postIdx) {
    const renderC = (c) => `
      <div class="c ${c.isOwn ? "reply" : ""}">
        <span class="cuser">${c.user}</span>${c.text}
        ${c.isOwn ? '<span class="reply-mark">Antwort · Profilinhaber:in</span>' : ""}
      </div>`;

    const hiddenCount = (hidden || []).length;
    const hiddenId = `hidden-${postIdx}`;
    const moreBtn = hiddenCount > 0
      ? `<button class="more-comments" data-target="${hiddenId}">Alle ${total} Kommentare ansehen</button>`
      : `<div class="more-comments" aria-disabled="true">Alle ${total} Kommentare</div>`;

    return `
      <div class="post-comments">
        ${(visible || []).map(renderC).join("")}
        <div id="${hiddenId}" class="hidden-comments">
          ${(hidden || []).map(renderC).join("")}
        </div>
        ${moreBtn}
      </div>
    `;
  }

  function renderActivities(a) {
    const patternHtml = a.rhythmPattern
      .map(t => `<i class="${t === "full" ? "" : t}"></i>`)
      .join("");

    return `
      <div class="dash-card">
        <h3>Posting-Rhythmus</h3>
        <div class="rhythm">
          <div class="rhythm-label">
            Frequenz
            <strong>${a.rhythm}</strong>
            <span style="font-size:11px;color:var(--muted);">${a.rhythmSub}</span>
          </div>
          <div class="rhythm-bars" aria-label="28-Tage-Verlauf">${patternHtml}</div>
        </div>
      </div>

      <div class="dash-card">
        <h3>Folgt vor allem …</h3>
        <ul class="follows-list">
          ${a.follows.map(f => `
            <li><span class="handle">${f.handle}</span><span class="cat">${f.cat}</span></li>
          `).join("")}
        </ul>
      </div>

      <div class="dash-card">
        <h3>Top-Kommentare auf eigenen Posts</h3>
        <div class="top-comments">
          ${a.topComments.map(c => `
            <div>„${c.text}“<span>× ${c.count}</span></div>
          `).join("")}
        </div>
      </div>

      <div class="dash-card">
        <h3>Eigene Kommentar-Aktivität</h3>
        <div class="activity-row">
          <div>
            <div class="activity-num">${a.ownActivity.number}</div>
            <div class="activity-lbl">${a.ownActivity.label}</div>
          </div>
          <div style="flex:1">
            <div class="activity-bar"><i style="width:${a.ownActivity.fill}%"></i></div>
            <div class="activity-scale">
              <span>selten</span><span>manchmal</span><span>oft</span>
            </div>
          </div>
        </div>
        <div class="reply-style" style="margin-top:10px;">${a.ownActivity.note}</div>
      </div>
    `;
  }

  // ===========================================================
  //  INTERAKTION
  // ===========================================================
  function bindViewSwitch() {
    const buttons = frame.querySelectorAll(".view-btn");
    const feed = frame.querySelector(".feed");
    const acts = frame.querySelector(".activities");
    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        const v = btn.dataset.view;
        if (v === "feed") {
          feed.classList.remove("hidden");
          acts.classList.remove("active");
        } else {
          feed.classList.add("hidden");
          acts.classList.add("active");
        }
      });
    });
  }

  function bindCommentExpand() {
    frame.querySelectorAll(".more-comments[data-target]").forEach(btn => {
      const originalLabel = btn.textContent;
      btn.addEventListener("click", () => {
        const target = document.getElementById(btn.dataset.target);
        if (!target) return;
        target.classList.toggle("open");
        btn.textContent = target.classList.contains("open")
          ? "Weniger Kommentare anzeigen"
          : originalLabel;
      });
    });
  }

  // Top-Tabs
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
      tab.classList.add("active");
      renderProfile(tab.dataset.target);
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
  });

  // Initial
  renderProfile("perfect");
</script>

</body>
</html>
